apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "w7panel-csm.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["csm.w7.cc"]
    resources: ["csms", "csms/status", "csms/finalizers", "datadisks", "datadisks/status", "datadisks/finalizers", "systemtemplates", "systemtemplates/status", "preinstallapplications", "preinstallexecutions", "preinstallexecutions/status", "upgradeversions", "upgradepolicies", "upgradeexecutions", "upgradeexecutions/status", "csmorders", "csmorders/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["w7panel.w7.com"]
    resources: ["licenses", "users"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "secrets", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["w7panel-csm-pricing", "w7panel-csm-coupons"]
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "tcproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
